<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BubbleLink</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="BubbleLink">
<meta property="og:title" content="BubbleLink">
<meta property="og:description" content="tap to open">
<meta property="og:image" content="https://sol-assistant.github.io/prettybubble/bubble.jpg">
<meta property="og:image:secure_url" content="https://sol-assistant.github.io/prettybubble/bubble.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1080">
<meta property="og:image:height" content="1350">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sol-assistant.github.io/prettybubble/bubble.jpg">
<meta name="description" content="tap to open">
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#fff;background:#0b0b0f;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:-12%;background:linear-gradient(135deg,#ff2d55,#5856d6) center/cover;filter:blur(46px) saturate(1.5) brightness(.7);transform:scale(1.1)}
#shade{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 20%,rgba(0,0,0,.05),rgba(0,0,0,.55))}
main{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));text-align:center}
#art{width:min(72vw,330px,44vh);aspect-ratio:1/1;border-radius:14px;background:linear-gradient(135deg,#ff2d55,#5856d6) center/cover no-repeat;box-shadow:0 30px 60px -18px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:90px}
#art.has span{display:none}
#t{margin-top:24px;font-size:24px;font-weight:700;letter-spacing:-.02em;max-width:340px;overflow-wrap:anywhere}
#s{margin-top:6px;font-size:17px;color:rgba(255,255,255,.72);max-width:340px}
#h{margin-top:10px;font-size:13px;color:rgba(255,255,255,.5)}
.btn{margin-top:22px;border:0;border-radius:999px;padding:14px 26px;font:600 16px/1 -apple-system,Arial,sans-serif;color:#000;background:#fff;cursor:pointer}
.btn2{background:rgba(255,255,255,.18);color:#fff}
#again{display:none}#again.on{display:inline-block}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:30px}
#ov.on{display:flex}
#sheet{width:270px;border-radius:14px;overflow:hidden;background:rgba(40,40,44,.82);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);text-align:center;animation:pop .25s ease}
@keyframes pop{from{transform:scale(1.15);opacity:0}to{transform:none;opacity:1}}
#sheet p{padding:19px 16px 18px;font-size:15px;line-height:1.35}
#sheet p b{display:block;font-size:17px;margin-bottom:4px}
.row{display:flex;border-top:.5px solid rgba(255,255,255,.2)}
.row button{flex:1;background:none;border:0;color:#0a84ff;font:17px -apple-system,Arial,sans-serif;padding:12px 0;cursor:pointer}
.row button+button{border-left:.5px solid rgba(255,255,255,.2);font-weight:600}
#mk{display:none;width:100%;max-width:380px}
#mk h1{font-size:34px;font-weight:800;letter-spacing:-.03em}
#mk .sub{color:rgba(255,255,255,.65);margin:6px 0 22px}
#in{width:100%;padding:15px;border-radius:14px;border:0;font-size:16px;background:rgba(255,255,255,.14);color:#fff;outline:none}
#in::placeholder{color:rgba(255,255,255,.5)}
#out{display:none;margin-top:18px;padding:14px;border-radius:14px;background:rgba(0,0,0,.35);font-size:13px;word-break:break-all;color:rgba(255,255,255,.85)}
#msg{margin-top:12px;font-size:14px;color:#ffd60a;min-height:18px}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<main>
<section id="land" style="display:none;flex-direction:column;align-items:center">
<div id="art"><span>&#9835;</span></div>
<div id="t">Loading...</div><div id="s"></div><div id="h"></div>
<button id="again" class="btn">Open</button>
</section>
<section id="mk">
<h1>BubbleLink</h1>
<div class="sub">paste a link, get a pretty one</div>
<input id="in" type="url" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="https://music.apple.com/...">
<button id="go" class="btn">Create</button>
<div id="msg"></div>
<div id="out"></div>
<div id="acts" style="display:none"><button id="cp" class="btn">Copy link</button> <button id="sh" class="btn btn2">Share</button> <button id="tr" class="btn btn2">Try it</button></div>
</section>
</main>
<div id="ov"><div id="sheet"><p><b>Open this page?</b><span id="q"></span></p><div class="row"><button id="no">Cancel</button><button id="yes">Open</button></div></div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function safe(u){try{var x=new URL(u);return (x.protocol==="https:"||x.protocol==="http:")?x:null}catch(e){return null}}
function fix(u){u=(u||"").trim();if(u&&!/^[a-z][a-z0-9+.-]*:/i.test(u))u="https://"+u;return u}
function setArt(src){if(!src)return;var list=[].concat(src),k=0;(function nx(){if(k>=list.length)return;var s=list[k++],i=new Image();i.onload=function(){if(i.naturalWidth<=120&&k<list.length)return nx();var c="url('"+s.replace(/'/g,"%27")+"')";$("art").style.backgroundImage=c;$("art").className="has";$("bg").style.backgroundImage=c};i.onerror=nx;i.src=s})()}
function txt(id,v){$(id).textContent=v||""}
var cbn=0;
function jsonp(url,cb){var n="pbcb"+(++cbn),s=document.createElement("script"),done=false;window[n]=function(d){done=true;cb(d);try{delete window[n]}catch(e){}s.remove()};s.onerror=function(){if(!done)cb(null)};setTimeout(function(){if(!done)cb(null)},6000);s.src=url+(url.indexOf("?")<0?"?":"&")+"callback="+n;document.head.appendChild(s)}
// fill in title/art from the link itself
function fill(x,cb){
 var h=x.hostname.replace(/^www\./,""),out={t:"",s:"",i:""};
 if(/(^|\.)music\.apple\.com$|(^|\.)itunes\.apple\.com$/.test(h)){
  var id=x.searchParams.get("i");if(!id){var m=x.pathname.match(/\/(?:id)?(\d{5,})\/?$/)||x.pathname.match(/\/id(\d{5,})/);id=m&&m[1]}
  var cc=(x.pathname.match(/^\/([a-z]{2})\//)||[])[1]||"us";
  if(!id)return cb(out);
  jsonp("https://itunes.apple.com/lookup?id="+id+"&country="+cc,function(d){var r=d&&d.results&&d.results[0];if(r){out.t=r.trackName||r.collectionName||r.artistName||"";out.s=r.artistName&&out.t!==r.artistName?r.artistName:"";out.i=(r.artworkUrl100||"").replace(/100x100bb/,"600x600bb")}cb(out)});return}
 if(/(^|\.)youtube\.com$|^youtu\.be$/.test(h)){
  var v=h==="youtu.be"?x.pathname.slice(1).split("/")[0]:(x.searchParams.get("v")||(x.pathname.match(/\/(?:shorts|embed|live)\/([\w-]+)/)||[])[1]);
  var isM=/^music\.youtube\.com$/.test(h);
  if(v)out.i=["https://i.ytimg.com/vi/"+v+"/maxresdefault.jpg","https://i.ytimg.com/vi/"+v+"/hqdefault.jpg"];
  var w=v?"https://www.youtube.com/watch?v="+v:x.href.replace("music.youtube.com","www.youtube.com");
  if(!window.fetch)return cb(out);
  fetch("https://www.youtube.com/oembed?format=json&url="+encodeURIComponent(w)).then(function(r){return r.json()}).then(function(d){if(d&&d.title){out.t=d.title;out.s=(d.author_name||"").replace(/ - Topic$/,"");if(!out.i&&d.thumbnail_url)out.i=d.thumbnail_url}cb(out)}).catch(function(){fetch("https://noembed.com/embed?url="+encodeURIComponent(w)).then(function(r){return r.json()}).then(function(d){if(d&&d.title){out.t=d.title;out.s=(d.author_name||"").replace(/ - Topic$/,"")}cb(out)}).catch(function(){cb(out)})});
  if(isM)$("art").style.borderRadius="14px";return}
 if(/(^|\.)spotify\.com$|^spotify\.link$/.test(h)){
  if(!window.fetch)return cb(out);
  fetch("https://open.spotify.com/oembed?url="+encodeURIComponent(x.href)).then(function(r){return r.json()}).then(function(d){if(d){out.t=d.title||"";out.i=d.thumbnail_url||"";var ty=(x.pathname.match(/\/(track|album|playlist|artist|episode|show)\//)||[])[1];out.s=ty?("Spotify "+ty):"Spotify"}cb(out)}).catch(function(){cb(out)});return}
 cb(out)}
var p=new URLSearchParams(location.search),u=p.get("u");
if(!u&&location.hash.length>1)u=new URLSearchParams(location.hash.slice(1)).get("u");
if(u!==null){
 $("land").style.display="flex";
 var x=safe(fix(u));
 if(!x){txt("t",u?"This link looks broken":"Nothing to open here");return}
 var host=x.hostname.replace(/^www\./,"");
 txt("t",host);txt("h",host);txt("q",'This website would like to open "'+host+'".');
 fill(x,function(o){if(o.t)txt("t",o.t);txt("s",o.s);setArt(o.i);document.title=o.t||host});
 var go=function(){location.href=x.href};
 $("yes").onclick=go;$("again").onclick=function(){$("ov").className="on"};
 $("no").onclick=function(){$("ov").className="";$("again").className="btn on"};
 setTimeout(function(){$("ov").className="on"},500);
 return}
// maker
$("mk").style.display="block";
var made="";
$("go").onclick=function(){var x=safe(fix($("in").value));if(!x){txt("msg","That doesn't look like a link");$("out").style.display="none";$("acts").style.display="none";return}
 made=location.origin+location.pathname+"?u="+encodeURIComponent(x.href);txt("msg","");txt("out",made);$("out").style.display="block";$("acts").style.display="block"};
$("in").onkeydown=function(e){if(e.key==="Enter")$("go").onclick()};
$("cp").onclick=function(){var ok=function(){txt("msg","Copied!")};if(navigator.clipboard)navigator.clipboard.writeText(made).then(ok,function(){txt("msg","Hold the link above to copy")});else txt("msg","Hold the link above to copy")};
$("sh").onclick=function(){if(navigator.share)navigator.share({url:made}).catch(function(){});else $("cp").onclick()};
$("tr").onclick=function(){location.href=made};
})();
</script>
</body>
</html>
