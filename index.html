<style>

.tools.on{display:flex}

<h1 class="logo">Create<span>.</span></h1>
<div class="pill">&#10024; AI video</div>
</header>

<canvas id="view" width="2" height="2" aria-label="Your photo and animation"></canvas>
<label class="empty" for="file" id="empty">
<div class="plus">+</div>
<b>Add a photo</b>
<small>Pick any photo. Then tell me what should happen to it.</small>
</label>
<input type="file" id="file" accept="image/*">
<div class="tag" id="tag"></div>
<div class="think" id="think"><div class="tcard"><div class="trow"><div class="spark"></div><div id="tmsg">Thinking...</div></div><div class="bar"><i id="tbar"></i></div><div class="tsub" id="tsub"></div></div></div>
</div>
<div style="text-align:center" id="samplerow"><button class="linkbtn" id="sample" type="button">No photo? Try a sample</button></div>
<div class="tools" id="tools">
<div class="seg" role="group" aria-label="Selection tool"><button type="button" class="on" data-m="tap">Tap</button><button type="button" data-m="brush">Brush</button><button type="button" data-m="erase">Erase</button></div>
<button class="ghost" type="button" id="clear">Clear</button>
<button class="ghost" type="button" id="newp">New photo</button>
</div>
<p class="hint" id="hint" style="display:none"></p>
<div class="composer">
<label for="prompt" style="position:absolute;left:-9999px">What should happen?</label>
<textarea id="prompt" rows="2" placeholder="Describe what should happen... like &quot;make the dog run away&quot;"></textarea>
<div class="chips" id="chips"></div>
<div class="weird"><label for="weird">Morph</label><input type="range" id="weird" min="0" max="100" value="35"><output id="wout">Morphy</output></div>
</div>
<button class="go" id="go" type="button">&#10024; Create</button>
<div class="reply" id="reply"><div class="av">C.</div><div class="bub" id="rtext"></div></div>
<div class="acts" id="acts"><button class="save" id="save" type="button">Save video</button><button class="ghost" id="again" type="button">Replay</button></div>
<div class="dl" id="dl"><a id="dla" href="#" download>Download the file instead</a></div>
</main>
<footer>Runs on your device. Free, no account, no limits.<br>Results may get extremely morphy.</footer>
</div>
<div class="toast" id="toast"></div>
